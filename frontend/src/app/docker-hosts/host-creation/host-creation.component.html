<div class="dialog-shell">
    <div class="dialog-title-block">
      <h2 mat-dialog-title class="dialog-title">Add New Host</h2>
      <p class="dialog-subtitle">Register a Docker node so BICEP can deploy systems and manage its metric service.</p>
    </div>
    <mat-dialog-content>
        <form [formGroup]="hostForm" class="dialog-form">
          <div class="form-item">
            <mat-form-field>
              <mat-label>Name</mat-label>
              <input matInput required [formControl]="hostForm.controls.name">
            </mat-form-field>
          </div>
          <div class="form-item">
            <mat-form-field>
              <mat-label>Hostname or IP</mat-label>
              <input matInput required [formControl]="hostForm.controls.host">
            </mat-form-field>
          </div>
          <div class="form-item">
            <mat-form-field>
              <mat-label>Docker Port</mat-label>
              <input matInput required [formControl]="hostForm.controls.dockerPort">
            </mat-form-field>
          </div>
        </form>
    </mat-dialog-content>
    <mat-dialog-actions>
      <div class="dialog-actions-div">
        <button class="start-button" matFab (click)="save()">
            <mat-icon>save</mat-icon>
        </button>
        <button class="cancel-button" matFab (click)="exit()">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>
    </mat-dialog-actions>
</div>
