<section class="page-shell comparison-container">
  <header class="page-hero">
    <div class="page-hero__copy">
      <span class="page-kicker">Benchmarking</span>
      <h1 class="page-title">{{ title }}</h1>
      <p class="page-subtitle">{{ subtitle }}</p>
    </div>
    <div class="page-hero__actions">
      <button class="back-button" (click)="close.emit()" matFab extended>
        <mat-icon>arrow_left</mat-icon>
        Back
      </button>
    </div>
  </header>

  <mat-card>
    <mat-card-content>
      <div class="config-panel">
        <div class="config-section">
          <h3>Chart type</h3>
          <mat-button-toggle-group [(ngModel)]="selectedChartType" (change)="updateChart()">
            <mat-button-toggle value="bar">Bar</mat-button-toggle>
            <mat-button-toggle value="radar">Radar</mat-button-toggle>
          </mat-button-toggle-group>
        </div>

        <div class="config-section metrics-section">
          <mat-form-field appearance="outline">
            <mat-label>Comparison criteria</mat-label>
            <mat-select [formControl]="selectedMetrics" multiple>
              <mat-option *ngFor="let metric of metrics" [value]="metric.value">
                {{ metric.viewValue }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <button class="download-button comparison-download-button" (click)="downloadChart()" matFab extended>
          <mat-icon>download</mat-icon>
          Download SVG
        </button>
      </div>

      <div class="chart-container" *ngIf="items.length && selectedMetrics.value?.length; else noCriteria">
        <div echarts [options]="chartOption" (chartInit)="onChartInit($event)" class="echart"></div>
      </div>
      <ng-template #noCriteria>
        <p class="comparison-empty">Select at least one comparison criterion.</p>
      </ng-template>
    </mat-card-content>
  </mat-card>
</section>
