
<div >
  <mat-dialog-content>
    <form [formGroup]="idsEdit">
      <div class="form-item">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput value={{data.container.name}} readonly="" disabled>
        </mat-form-field>
      </div>
      <div class="form-item">
        <mat-form-field>
          <mat-label>Target host</mat-label>
          <input matInput value={{data.container.host_system_id}} readonly="" disabled>
        </mat-form-field>
      </div>
      <div class="form-item" >
        <mat-form-field >
          <mat-label>Port</mat-label>
          <input matInput value={{data.container.port}} readonly="" disabled>
        </mat-form-field>
      </div>
      <div class="form-item">
        <mat-form-field>
          <mat-label>Configuration</mat-label>
          <mat-select [formControl]="idsEdit.controls.config" required>
            @for (c of configurationList; track c) {
              <mat-option value={{c.id}}>ID: {{c.id}} - {{c.name}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      @if (selectedRuleset) {
        <div class="form-item">
          <mat-form-field>
            <mat-label>Ruleset</mat-label>
            <mat-select [formControl]="idsEdit.controls.ruleset" required>
              @for (c of rulesetList; track c) {
                <mat-option value={{c.id}}>ID: {{c.id}} - {{c.name}}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      }
      <div class="form-item">
        <mat-form-field>
          <mat-label>IDS Tool</mat-label>
          <input matInput value={{selectedIdsTool.name}} readonly="" disabled>
        </mat-form-field>
      </div>
      <div class="form-item">
        <mat-form-field>
          <mat-label>Description</mat-label>
          <textarea matInput [formControl]="idsEdit.controls.description" required></textarea>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions>
    <div class="dialog-actions-div">
      <button (click)="save()" class="start-button" matFab>
        <mat-icon>save</mat-icon>
      </button>
      <button (click)="exit()" class="cancel-button" matFab>
        <mat-icon>cancel</mat-icon>
      </button>
    </div>

  </mat-dialog-actions>
</div>
