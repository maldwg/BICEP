<div class="monitoring-container">
    <div class="header">
        <div class="controls">
            <mat-form-field appearance="outline" class="time-selector">
                <mat-label>Time Range</mat-label>
                <mat-select [(value)]="selectedTimeRange" (selectionChange)="onQuickRangeChange()">
                    <mat-option value="5m">Last 5 minutes</mat-option>
                    <mat-option value="15m">Last 15 minutes</mat-option>
                    <mat-option value="30m">Last 30 minutes</mat-option>
                    <mat-option value="1h">Last 1 hour</mat-option>
                    <mat-option value="3h">Last 3 hours</mat-option>
                    <mat-option value="custom">Custom Range</mat-option>
                </mat-select>
            </mat-form-field>

            <!-- Only show when Custom Range selected -->
            <div *ngIf="selectedTimeRange === 'custom'" class="custom-time-inputs">
                <mat-form-field appearance="outline" class="datetime-picker">
                    <mat-label>From (optional)</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="customStartTime" (change)="onCustomTimeChange()">
                </mat-form-field>

                <mat-form-field appearance="outline" class="datetime-picker">
                    <mat-label>To (optional)</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="customEndTime" (change)="onCustomTimeChange()">
                </mat-form-field>
            </div>

            <button matTooltip="Export selected containers to CSV" mat-fab extended (click)="exportCSV()"
                style="margin-top: 0px;" *ngIf="containers.length > 0" class="export-fab download-button">
                <mat-icon>download</mat-icon>
                Export
            </button>
        </div>

    </div>

    <div class="charts-wrapper" *ngIf="containers.length > 0; else noContainers">
        <div class="component-toolbar" *ngIf="cidsContainers.length > 0">
            <div class="component-controls-header">
                <div class="component-controls-copy">
                    <span class="component-controls-label">CIDS Components</span>
                    <span class="component-controls-hint">Overlay individual component series for any CIDS, then collapse back to the overall view.</span>
                </div>

                <button
                    mat-flat-button
                    color="primary"
                    type="button"
                    class="component-reset-button"
                    *ngIf="hasExpandedCids"
                    (click)="showOverallOnly()"
                >
                    Show overall only
                </button>
            </div>

            <div class="component-controls-actions">
                <button
                    mat-stroked-button
                    type="button"
                    class="component-toggle-button"
                    *ngFor="let container of cidsContainers"
                    (click)="toggleCidsComponents(container)"
                >
                    {{ isCidsExpanded(container.id) ? 'Hide' : 'Show' }} {{ container.name }} components
                </button>
            </div>
        </div>

        <!-- CPU Chart -->
        <div class="chart-container">
            <div echarts [options]="cpuChartOption" (chartInit)="onCpuChartInit($event)" class="chart"></div>
        </div>

        <!-- Memory Chart -->
        <div class="chart-container">
            <div echarts [options]="memoryChartOption" (chartInit)="onMemoryChartInit($event)" class="chart"></div>
        </div>
    </div>

    <ng-template #noContainers>
        <div class="no-data">
            <mat-icon>info</mat-icon>
            <p>No active IDS containers found.</p>
        </div>
    </ng-template>
</div>
