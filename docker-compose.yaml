version: '3.4'

services:
  angular:
    build:
      context: ./frontend
      args:
        - PRODUCTION=${PRODUCTION:-False}
    ports:
      - 8080:80
    networks:
      - bicep
    environment:
      - PRODUCTION=${PRODUCTION:-False}
  grafana:
    build:
      context: ./grafana
    ports:
      - 3000:3000
    networks:
      - bicep
    environment:
      - GF_PATHS_PROVISIONING=/usr/share/grafana/conf/provisioning
      - TZ=UTC

  prometheus:
    build:
      context: ./prometheus
    ports:
      - 9090:9090
    networks:
      - bicep
  prometheus-push-gateway:
    image: prom/pushgateway
    ports:
      - 9091:9091
    networks:
      - bicep
  core:
    build:
      context: ./backend/core
    volumes:
      - ./backend/core/app:/opt/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    depends_on:
      database:
        condition: service_healthy

    ports:
      - 8000:8000
    networks:
      - bicep
    environment:
      - DATABASE_URL=bicep-database-1
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=bicep
      - DATASET_BASE_PATH=/opt/datasets
      - RUNTIME_STORE_BASE_PATH=/opt/runtime_configurations
      - DEPLOYMENT_STORE_BASE_PATH=/opt/deployment_configurations
      - RULESET_STORE_BASE_PATH=/opt/rulesets
      - PROMETHEUS_PUSH_GATEWAY_URL=prometheus-push-gateway:9091
      - PROMETHEUS_URL=prometheus:9090
      - LOKI_URL=http://loki:3100
      - TZ=UTC
      - UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN=600
      - UVICORN_TIMEOUT_KEEP_ALIVE=600
      - PRODUCTION=${PRODUCTION:-False}
      - EXTERNAL_FASTAPI_PORT=8000
      - CORE_HOST_IP=${CORE_HOST_IP}
      - HOST_AVAILABILITY_CHECK_INTERVAL=15
      - METRIC_SERVICE_IMAGE_NAME=ghcr.io/bicep-pump/metric-service
      - METRIC_SERVICE_IMAGE_VERSION=v1.1.0
  database:
    build:
      context: ./database
    environment:
      - MARIADB_ROOT_PASSWORD=root
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p$${MARIADB_ROOT_PASSWORD} -e 'SELECT 1'"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bicep
  loki:
    build:
      context: ./loki
    ports:
      - 3100:3100
    networks:
      - bicep
    command: -config.file=/mnt/config/loki-config.yaml
    volumes:
      - ./loki/loki:/mnt/config
    environment:
      - LOG_LEVEL=debug
      - TZ=UTC

networks:
  bicep:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
