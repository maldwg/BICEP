version: '3.4'

services:
  angular:
    build:
      context: ./frontend
      args:
        - PRODUCTION=${PRODUCTION:-False}
    ports:
      - 8080:80
    networks:
      - bicep
    environment:
      - PRODUCTION=${PRODUCTION:-False}
  grafana:
    build:
      context: ./grafana
    ports:
      - 3000:3000
    networks:
      - bicep
    environment:
      - GF_PATHS_PROVISIONING=/usr/share/grafana/conf/provisioning
      - TZ=UTC

  prometheus:
    build:
      context: ./prometheus
    ports:
      - 9090:9090
    networks:
      - bicep
  prometheus-push-gateway:
    image: prom/pushgateway
    ports:
      - 9091:9091
    networks:
      - bicep
  core:
    build:
      context: ./backend/core
    volumes:
      - ./backend/core/app:/opt/app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    ports:
      - 8000:8000
    networks:
      - bicep
    environment:
      - DATABASE_URL=bicep-database-1
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_NAME=bicep
      - DATASET_BASE_PATH=/opt
      - CONFIGURATION_STORE_BASE_PATH=/opt/configuration_data
      - RULESET_STORE_BASE_PATH=/opt/rulesets
      - PROMETHEUS_PUSH_GATEWAY_URL=prometheus-push-gateway:9091
      - PROMETHEUS_URL=prometheus:9090
      - LOKI_URL=http://loki:3100
      - TZ=UTC
      - UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN=600
      - UVICORN_TIMEOUT_KEEP_ALIVE=600
      - PRODUCTION=${PRODUCTION:-False}
      - EXTERNAL_FASTAPI_PORT=8000
  database:
    build:
      context: ./database
    environment:
      - MARIADB_ROOT_PASSWORD=root
    ports:
      - 3306:3306
    networks:
      - bicep
  loki:
    build:
      context: ./loki
    ports:
      - 3100:3100
    networks:
      - bicep
    command: -config.file=/mnt/config/loki-config.yaml
    volumes:
      - ./loki/loki:/mnt/config
    environment:
      - LOG_LEVEL=debug
      - TZ=UTC
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    ports:
      - "9092:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - bicep

networks:
  bicep:
    driver: bridge
    ipam:
      driver: default

